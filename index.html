<!DOCTYPE html>
<html lang="fr" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece7fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petit Dodo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="firebase-config.js"></script>
<title>Petit Dodo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="day"]{
  --bg:#fbf7f2;--bg2:#ece7fb;--surface:#ffffff;--surface2:#f6f2fb;--border:#ebe5f3;
  --text:#3a3450;--muted:#7a7391;--faint:#a9a2bb;
  --accent:#7b68e0;--on-accent:#ffffff;
  --sleep:#9d8cf2;--sleep2:#6f60d4;--sleep-soft:#efebff;
  --feed:#f3a07a;--feed-soft:#ffefe6;--bottle:#ecbd52;--bottle-soft:#fff6de;
  --diaper:#62c3a3;--diaper-soft:#e3f6ef;--note:#74a9e6;--note-soft:#e7f1fd;
  --ok:#62c3a3;--warn:#ecbd52;--hot:#f0907a;--danger:#d9586f;
  --shadow:0 8px 28px rgba(96,80,160,.08),0 1px 3px rgba(96,80,160,.05);
  --scrim:rgba(58,52,80,.28);
  color-scheme:light;
}
[data-theme="night"]{
  --bg:#13132e;--bg2:#24224f;--surface:#1d1d40;--surface2:#272652;--border:#32315e;
  --text:#f1efff;--muted:#aeaad3;--faint:#78759f;
  --accent:#b4a8ff;--on-accent:#1b173d;
  --sleep:#b4a8ff;--sleep2:#7c6ee2;--sleep-soft:#2e2b63;
  --feed:#ffb795;--feed-soft:#3a2c45;--bottle:#ffd77e;--bottle-soft:#373448;
  --diaper:#86dcc0;--diaper-soft:#203f48;--note:#a0c8ff;--note-soft:#233459;
  --ok:#86dcc0;--warn:#ffd77e;--hot:#ff9f8a;--danger:#ff8095;
  --shadow:0 8px 28px rgba(0,0,0,.25);
  --scrim:rgba(6,6,24,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{color:var(--text);font-family:'Nunito',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5;min-height:100vh;padding-top:env(safe-area-inset-top);
  background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 420px) no-repeat,var(--bg);transition:background-color .4s ease}
[data-theme="night"] body{background:
  radial-gradient(1.5px 1.5px at 12% 6%,rgba(255,255,255,.55) 50%,transparent 51%),
  radial-gradient(1px 1px at 32% 14%,rgba(255,255,255,.45) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 58% 4%,rgba(255,255,255,.5) 50%,transparent 51%),
  radial-gradient(1px 1px at 76% 17%,rgba(255,255,255,.4) 50%,transparent 51%),
  radial-gradient(1px 1px at 90% 9%,rgba(255,255,255,.5) 50%,transparent 51%),
  linear-gradient(180deg,var(--bg2) 0,var(--bg) 420px) no-repeat,var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:520px;margin:0 auto;padding:12px 18px calc(112px + env(safe-area-inset-bottom))}
h1,h2,h3,.serif{font-family:'Quicksand','Nunito',sans-serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px;line-height:1.25}
h3{font-size:16px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 18px;gap:12px}
.top .age{color:var(--muted);font-size:14px;font-weight:600}
.hello{display:flex;align-items:center;gap:14px}
.deco{width:60px;height:60px;flex:0 0 60px}
.agepill{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--sleep-soft);color:var(--accent);font-size:12.5px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.sec-title h3{font-size:17px}
.banner{border-radius:16px;padding:10px 14px;font-size:14px;margin-bottom:12px;background:var(--surface2);color:var(--muted)}
.banner.warn{background:var(--bottle-soft);color:var(--text)}

/* Status */
.status{display:flex;gap:18px;align-items:center;padding:20px}
.status.awake{background:linear-gradient(150deg,var(--surface) 40%,var(--diaper-soft))}
.status.due{background:linear-gradient(150deg,var(--surface) 40%,var(--feed-soft))}
.sleeping{background:linear-gradient(150deg,var(--sleep-soft),var(--surface) 75%)}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ringsvg{width:132px;height:132px}
.ringsvg .track{fill:none;stroke:var(--border);stroke-width:9}
.ringsvg .prog{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s ease,stroke .8s ease}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-in .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ring-in .big{font-family:'Quicksand',sans-serif;font-weight:700;font-size:25px;font-variant-numeric:tabular-nums}
.st-txt{flex:1;min-width:0}
.st-txt h2{margin-bottom:2px}
.st-txt p{font-size:14px;margin-bottom:2px}
.st-txt .when{font-family:'Quicksand',sans-serif;font-weight:700;font-size:30px;overflow-wrap:anywhere;line-height:1.1;margin:2px 0 4px;color:var(--accent)}
.st-txt .btn{margin-top:12px}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit;padding:0;font-weight:700}
.breathe{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-weight:800;font-size:15px;transition:transform .15s ease}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 6px 18px rgba(123,104,224,.28)}
[data-theme="night"] .btn.primary{box-shadow:none}
.btn.feed{background:var(--feed);color:#3a1d0d;border-color:transparent}
.btn.danger{color:var(--danger);background:transparent;border-color:var(--border)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}

/* Quick actions */
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 16px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 0;min-height:84px}
.qa .em{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;box-shadow:var(--shadow);transition:transform .2s ease}
.qa:active .em{transform:scale(.92)}
.qa span:last-child{font-size:12.5px;font-weight:700;color:var(--muted)}
.qa[data-act="sleep"] .em{background:var(--sleep-soft)}
.qa[data-act="feed"] .em{background:var(--feed-soft)}
.qa[data-act="bottle"] .em{background:var(--bottle-soft)}
.qa[data-act="diaper"] .em{background:var(--diaper-soft)}
.qa[data-act="note"] .em{background:var(--note-soft)}
.qa.on .em{outline:2.5px solid var(--accent);outline-offset:3px}
.qa.on span:last-child{color:var(--accent)}

.running{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--feed-soft);border-color:transparent}
.running .t{flex:1;min-width:150px;font-weight:600}
.running .t b{font-variant-numeric:tabular-nums}

.info-row{display:flex;gap:10px}
.info{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.info .k{font-size:12.5px;color:var(--muted)}
.info .v{font-weight:800;font-size:15.5px}

/* Strip */
.strip{position:relative;height:40px;border-radius:14px;background:var(--surface2);overflow:hidden;margin:2px 0 6px}
.strip .blk{position:absolute;top:7px;bottom:7px;border-radius:8px;background:var(--sleep)}
.strip .blk.night{background:var(--sleep2)}
.strip .blk.pred{background:transparent;border:1.5px dashed var(--sleep)}
.strip .tick{position:absolute;top:3px;width:3px;height:8px;border-radius:2px}
.strip .dot{position:absolute;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--diaper);margin-left:-3px}
.strip .now{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.55}
.strip .bed{position:absolute;top:5px;bottom:5px;width:3px;margin-left:-1px;background:var(--feed);border-radius:2px}
.hours{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);padding:0 1px;font-weight:600}

/* Lists */
.list{list-style:none}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.list .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--sleep-soft);flex:0 0 40px}
.list .main{flex:1;min-width:0}
.list .ttl{font-weight:800;font-size:15px}
.list .sub{font-size:13px;color:var(--muted)}
.list .tm{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);text-align:right;font-weight:700}
.list li.pred .ic{background:transparent;border:1.5px dashed var(--sleep)}
.list li.pred .ttl{color:var(--accent)}
.list button.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.who{font-size:11px;font-weight:800;color:var(--accent);background:var(--sleep-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.dayhead{font-family:'Quicksand',sans-serif;font-weight:700;font-size:15px;color:var(--muted);margin:18px 4px 8px}
.c-sleep{background:var(--sleep-soft)!important}
.c-feed{background:var(--feed-soft)!important}
.c-bottle{background:var(--bottle-soft)!important}
.c-diaper{background:var(--diaper-soft)!important}
.c-note{background:var(--note-soft)!important}
.c-bath{background:var(--note-soft)!important}
.c-med{background:var(--feed-soft)!important}
.c-growth{background:var(--diaper-soft)!important}
.c-temp{background:var(--feed-soft)!important}
.c-visit{background:var(--note-soft)!important}
.alert{background:var(--feed-soft);border-color:transparent}
.alert b{color:var(--text)}
.upcoming{display:flex;align-items:center;gap:12px;background:var(--note-soft);border-color:transparent}
.upcoming .ic{font-size:24px}
.reportbtn{margin:0 0 14px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:18px;background:var(--surface2);margin:0 0 14px}
.tabs button{flex:1;min-height:42px;border-radius:14px;font-weight:800;font-size:14.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.qa[data-act="more"] .em{background:var(--note-soft)}
.gchart svg{width:100%;height:auto;display:block}
.gchart h3{margin-bottom:6px}

/* Stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:'Quicksand',sans-serif;font-weight:700;font-size:24px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 4px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:700;font-size:12px}

/* Sounds */
.sounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.snd{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);text-align:left;min-height:66px;box-shadow:var(--shadow)}
.snd .em{width:38px;height:38px;border-radius:50%;background:var(--sleep-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 38px}
.snd .nm{font-weight:800;font-size:14px;line-height:1.2}
.snd.on{border-color:var(--accent);background:var(--sleep-soft)}
.snd.on .em{background:var(--surface)}
.snd.on .nm{color:var(--accent)}
.player{display:flex;flex-direction:column;gap:14px;background:linear-gradient(150deg,var(--sleep-soft),var(--surface) 80%)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
input[type=range]{width:100%;accent-color:var(--accent)}
.wave{display:flex;align-items:flex-end;gap:3px;height:22px}
.wave i{width:4px;border-radius:2px;background:var(--accent);animation:wv 1.4s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.2s}.wave i:nth-child(3){animation-delay:.4s}.wave i:nth-child(4){animation-delay:.6s}
@keyframes wv{0%,100%{height:6px}50%{height:20px}}

/* Forms */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:16px;border:1px solid var(--border);background:var(--surface2);font-size:16px}
.field input,.field select{max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;text-align:left}
.field input::-webkit-date-and-time-value{text-align:left}
.row>.field{min-width:0}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field textarea{min-height:90px;resize:vertical}
.seg{display:flex;gap:6px;margin-bottom:12px;padding:4px;border-radius:18px;background:var(--surface2)}
.seg label{flex:1}
.seg label{position:relative}
.seg input,.field .seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0;padding:0;border:0;left:0;top:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:14px;font-weight:800;font-size:14.5px;text-align:center;padding:0 6px;color:var(--muted);transition:background .2s ease}
.seg input:checked+span{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--faint);margin:-4px 0 12px}
.err{color:var(--danger);font-size:14px;margin-bottom:8px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bigchoice.three{grid-template-columns:1fr 1fr 1fr}
.bigchoice button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border-radius:22px;background:var(--surface2);border:1.5px solid transparent;font-weight:800}
.bigchoice button .em{font-size:30px}
.bigchoice button.sug{border-color:var(--feed);background:var(--feed-soft)}
.bigchoice button small{font-weight:700;color:var(--feed);font-size:12px}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:30px 30px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(40,30,90,.15)}
#sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 14px}
#sheet h2{margin-bottom:12px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Nav */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;max-width:496px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:26px;box-shadow:0 10px 34px rgba(60,45,130,.14)}
[data-theme="night"] .nav{box-shadow:0 10px 34px rgba(0,0,0,.4)}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:800;color:var(--faint);min-height:54px;border-radius:20px;transition:background .2s ease,color .2s ease}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--sleep-soft)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:800;font-size:14px;padding:11px 18px;border-radius:999px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.2);animation:up .25s ease}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty .em{font-size:36px;display:block;margin-bottom:8px}
.foot{text-align:center;color:var(--faint);font-size:12.5px;margin-top:26px}
.skel{height:160px;border-radius:24px;background:var(--surface);border:1px solid var(--border);margin-bottom:14px;animation:breathe 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app"><main id="main" aria-live="polite"></main></div>

<nav class="nav" aria-label="Navigation"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Aujourd'hui</button>
  <button data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Journal</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>

<script>
/* Petit Dodo — DevLabs - A. Giraud */
'use strict';
const $ = s => document.querySelector(s);

const MIN = 60000, HR = 3600000, DAY = 86400000;

const toInput = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const median = a => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };

function dayLabel(key) {
  const today = dayKey(Date.now()), yest = dayKey(Date.now() - DAY);
  if (key === today) return "Aujourd'hui";
  if (key === yest) return 'Hier';

/* ---------- State ---------- */
const S = { days: new Map(), measures: new Map(), statsTab: 'sleep', events: [], config: null, configLoaded: false, me: null, mode: 'loading', tab: 'home',

const cfg = () => Object.assign({}, DEFAULT_CFG, S.config || {});
try { S.theme = localStorage.getItem('petitdodo.theme') || 'auto'; } catch (e) { S.theme = 'auto'; }
function resolvedTheme() {

}

const DECO_DAY = '<svg class="deco" viewBox="0 0 64 64" aria-hidden="true"><circle cx="38" cy="24" r="13" fill="var(--bottle)"/><path d="M13 45a9.5 9.5 0 0 1 10-10.5 13 13 0 0 1 24.5 3A8 8 0 0 1 47 53H20a8 8 0 0 1-7-8z" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/></svg>';
const DECO_NIGHT = '<svg class="deco" viewBox="0 0 64 64" aria-hidden="true"><mask id="crescent"><rect width="64" height="64" fill="#fff"/><circle cx="41" cy="24" r="15" fill="#000"/></mask><circle cx="31" cy="33" r="19" fill="var(--bottle)" mask="url(#crescent)"/><circle cx="49" cy="14" r="1.8" fill="var(--text)" opacity=".85"/><circle cx="55" cy="30" r="1.3" fill="var(--text)" opacity=".7"/><circle cx="44" cy="6" r="1.1" fill="var(--text)" opacity=".6"/></svg>';

/* ---------- Stockage : Firebase (synchronisé) ou local (repli) ---------- */
let DB = null, AUTH = null, FBM = null, writeChain = Promise.resolve();
const LS_KEY = 'petitdodo.v1';
const FB_VER = '10.12.2';
function queue(fn) { const p = writeChain.then(fn); writeChain = p.catch(() => {}); return p; }

}
function localLoad() {

}
function localSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ days: Object.fromEntries(S.days), measures: Object.fromEntries(S.measures), config: S.config })); } catch (e) {} }

// Petite couche qui donne à Firestore la même forme que le reste du code attend
function makeDb(fs, m) {
  const snapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });

    onSnapshot: (next, err) => m.onSnapshot(q, s => next({ docs: s.docs.map(snapDoc), size: s.size, empty: s.empty, metadata: s.metadata }), err),
    get: () => m.getDocs(q).then(s => ({ docs: s.docs.map(snapDoc), size: s.size, empty: s.empty, metadata: s.metadata }))

    doc(path) {

    del: () => m.deleteField()

}

function rebuild() {
  const out = [];
  for (const [k, doc] of S.days) {
    const evs = (doc && doc.events) || {};
    for (const id in evs) { const e = evs[id]; if (e && e.type && typeof e.start === 'number') out.push(Object.assign({}, e, { id, day: k })); }
  }
  for (const [id, m] of S.measures) if (m && typeof m.start === 'number') out.push(Object.assign({}, m, { type: 'growth', id, day: null }));
  out.sort((a, b) => a.start - b.start);
  S.events = out;
  render();
}

const FIELDS = ['type', 'start', 'end', 'side', 'ml', 'milk', 'kind', 'text', 'night', 'min', 'c', 'notes', 'by', 'at'];
const MFIELDS = ['start', 'kg', 'height', 'head', 'by', 'at'];
// Les mesures de croissance vivent dans leur propre collection : tout l'historique reste visible.
async function putMeasure(ev) {
  const clean = {};
  for (const k of MFIELDS) if (ev[k] !== undefined && ev[k] !== null) clean[k] = ev[k];
  if (!DB) { S.measures.set(ev.id, clean); localSave(); rebuild(); return; }
  return queue(() => DB.doc('measures/' + ev.id).set(clean)).catch(err => toast(errMsg(err)));
}
async function putEvent(ev) {
  if (ev.type === 'growth') return putMeasure(ev);
  const clean = {};
  for (const k of FIELDS) if (ev[k] !== undefined) clean[k] = ev[k];
  if ((ev.type === 'sleep' || ev.type === 'feed') && clean.end === undefined) clean.end = null;
  const day = dayKey(ev.start), oldDay = ev.day;
  if (oldDay && oldDay !== day) await delEvent({ id: ev.id, day: oldDay });
  if (!DB) {
    const d = S.days.get(day) || { day, events: {} };
    S.days.set(day, { day, events: Object.assign({}, d.events, { [ev.id]: clean }) });
    localSave(); rebuild(); return;
  }
  return queue(() => DB.doc('days/' + day).merge({ day, events: { [ev.id]: clean } })).catch(err => toast(errMsg(err)));
}
async function delEvent(ev) {
  if (ev.type === 'growth') {
    if (!DB) { S.measures.delete(ev.id); localSave(); rebuild(); return; }
    return queue(() => DB.doc('measures/' + ev.id).delete()).catch(err => toast(errMsg(err)));
  }
  const day = ev.day || dayKey(ev.start);
  if (!DB) {
    const d = S.days.get(day);
    if (d) { const e = Object.assign({}, d.events); delete e[ev.id]; S.days.set(day, { day, events: e }); localSave(); rebuild(); }
    return;
  }

}
async function saveConfig(c) {

}

function fbConfigured() { const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && !/COLLE|XXXX/i.test(c.apiKey) && c.projectId); }

    const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
    const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);

    catch (e) { fs = fsM.getFirestore(app); }

    authM.onAuthStateChanged(AUTH, u => {
      if (u) { S.me = u.uid; S.userEmail = u.email || ''; if (!DB) { DB = makeDb(fs, fsM); S.mode = 'sync'; subscribe(); registerMember(u); } }
      else { DB = null; S.me = null; S.mode = 'auth'; S.days = new Map(); S.measures = new Map(); S.events = []; render(); }
    });

}
async function registerMember(u) {
  try {
    const ref = DB.doc('members/' + u.uid), s = await ref.get();
    if (!s.exists) await ref.set({ name: (u.email || '').split('@')[0], email: u.email || '' });

}
function subscribe() {
  let confirmed = false;
  const timer = setTimeout(() => { if (!confirmed) { S.netWarn = true; render(); } }, 10000);
  DB.collection('days').where('day', '>=', dayKey(Date.now() - 400 * DAY)).onSnapshot(snap => {
    S.days = new Map(); snap.docs.forEach(d => S.days.set(d.id, d.data()));

const whoName = id => { if (!id) return ''; if (id === S.me) return 'Toi'; const n = S.profiles[id]; return n ? n.split(' ')[0] : ''; };

/* ---------- Connexion ---------- */

/* ---------- Application installable : service worker et mises à jour ---------- */
let SWREG = null;
function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    SWREG = reg;
    const watch = w => w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { S.newVersion = true; render(); } });
    if (reg.waiting && navigator.serviceWorker.controller) { S.newVersion = true; render(); }
    reg.addEventListener('updatefound', () => watch(reg.installing));
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });

}

/* ---------- Fichiers : partager / télécharger ---------- */
async function saveFile(name, blob) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }

  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);

/* ---------- Sleep logic ---------- */
// [âge max en semaines, fenêtre d'éveil (min), siestes/jour, durée de sieste (min)]
const TABLE = [[4, 50, 5, 60], [8, 65, 5, 50], [12, 80, 4, 50], [16, 95, 4, 55], [24, 120, 3, 60], [32, 150, 3, 60], [40, 175, 2, 75], [52, 200, 2, 75], [78, 250, 1, 120], [9999, 330, 1, 120]];
const sleeps = () => S.events.filter(e => e.type === 'sleep');
const ongoing = type => { const l = S.events.filter(e => e.type === type && e.end == null); return l[l.length - 1] || null; };
function isNight(e) {

  const c = cfg(), m = minutesOf(e.start), bed = parseHM(c.bedtime), wake = parseHM(c.wakeTime);
  if (e.end && e.end - e.start > 5 * HR) return true;
  return m >= bed - 75 || m < wake - 45;
}
function isNightAwake(t) { const c = cfg(), m = minutesOf(t); return m >= parseHM(c.bedtime) + 60 || m < parseHM(c.wakeTime) - 45; }

function ageText() {
  const w = ageWeeks(); if (w == null || w < 0) return '';
  const d = Math.floor(w * 7);
  if (d < 14) return d + (d > 1 ? ' jours' : ' jour');
  if (w < 13) return Math.floor(w) + ' semaines';
  const m = Math.floor(d / 30.44); return m + ' mois';
}
function personal() {
  const since = Date.now() - 7 * DAY;
  const sl = sleeps().filter(s => s.end != null).sort((a, b) => a.start - b.start);
  const gaps = [], naps = [];
  for (let i = 0; i < sl.length; i++) {
    const s = sl[i]; if (s.end < since) continue;
    const night = isNight(s);
    if (!night) { const d = s.end - s.start; if (d >= 10 * MIN && d <= 4 * HR) naps.push(d); }
    if (i > 0) {

    }
  }
  const days = new Set(sl.filter(s => s.start >= since).map(s => dayKey(s.start))).size;

}
function params() {
  const aw = ageWeeks();
  const row = TABLE.find(r => (aw == null ? 16 : aw) < r[0]) || TABLE[TABLE.length - 1];
  const p = personal();
  const w1 = Math.min(p.wwN / 12, 0.75), w2 = Math.min(p.napN / 8, 0.75);
  const ww = p.ww ? row[1] * MIN * (1 - w1) + p.ww * w1 : row[1] * MIN;

}

    const near = segs.filter(x => { const d = Math.abs(minutesOf(x.start) - m0); return Math.min(d, 1440 - d) <= 90; });

/* ---------- Sheets ---------- */
function openSheet(html, mount) {
  const el = $('#sheet');
  el.innerHTML = `<div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  el.classList.add('open');
  S.lastFocus = document.activeElement;
  if (mount) mount(el);
  const f = el.querySelector('[autofocus]') || el.querySelector('.panel button, .panel input');
  if (f) f.focus({ preventScroll: true });
}
function closeSheet() { const el = $('#sheet'); el.classList.remove('open'); el.innerHTML = ''; if (S.lastFocus && S.lastFocus.focus) try { S.lastFocus.focus({ preventScroll: true }); } catch (e) {} }
const seg = (name, opts, cur) => `<div class="seg" role="radiogroup">${opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}"${v === cur ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
const field = (label, inner) => `<label class="field"><span>${label}</span>${inner}</label>`;

function editSheet(ev, isNew) {
  const t = ev.type; let b = '';
  if (t === 'sleep' || t === 'feed') {
    if (t === 'feed') b += seg('side', [['G', 'Sein gauche'], ['D', 'Sein droit']], ev.side || 'G');
    if (t === 'sleep' && !isNew) b += seg('night', [['0', 'Sieste'], ['1', 'Nuit']], isNight(ev) ? '1' : '0');
    b += field('Début', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
    b += field('Fin', `<input type="datetime-local" name="end" value="${ev.end ? toInput(ev.end) : ''}">`);
    b += `<p class="hint">Laisse « Fin » vide si c'est encore en cours.</p>`;
  } else if (t === 'bottle') {
    b += field('Heure', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
    b += `<div class="chips" style="margin-bottom:10px">${[60, 90, 120, 150, 180, 210].map(v => `<button type="button" class="chip" data-ml="${v}">${v} ml</button>`).join('')}</div>`;
    b += field('Quantité (ml)', `<input type="number" name="ml" inputmode="numeric" min="0" max="400" step="5" value="${ev.ml || ''}" required>`);
    b += seg('milk', [['infantile', 'Lait infantile'], ['maternel', 'Lait maternel']], ev.milk || 'infantile');
  } else if (t === 'diaper') {
    b += seg('kind', [['pipi', 'Pipi'], ['selle', 'Selle'], ['mixte', 'Les deux']], ev.kind || 'pipi');
    b += field('Heure', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
  } else if (t === 'bath') {
    b += field('Heure', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
    b += `<div class="chips" style="margin-bottom:10px">${[5, 10, 15, 20].map(v => `<button type="button" class="chip" data-min="${v}">${v} min</button>`).join('')}</div>`;
    b += field('Durée (min)', `<input type="number" name="min" inputmode="numeric" min="1" max="90" step="1" value="${ev.min || ''}">`);
  } else if (t === 'med') {
    b += field('Heure', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
    const rm = recentMeds();
    if (rm.length) b += `<div class="chips" style="margin-bottom:10px">${rm.map(m => `<button type="button" class="chip" data-med="${esc(m)}">${esc(m)}</button>`).join('')}</div>`;
    b += field('Traitement et dose', `<input name="text" maxlength="120" value="${esc(ev.text || '')}" placeholder="ex. Vitamine D, 1 goutte" autocomplete="off">`);
  } else if (t === 'temp') {
    b += field('Heure', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
    b += field('Température (°C)', `<input type="number" name="c" inputmode="decimal" min="34" max="43" step="0.1" value="${ev.c || ''}" placeholder="ex. 37,2" autofocus>`);
    b += `<p class="hint">Avant 3 mois, une température de 38 °C ou plus doit faire appeler le médecin rapidement, ou le 15 en cas de signe inquiétant.</p>`;
  } else if (t === 'visit') {
    b += field('Date et heure', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
    b += `<div class="chips" style="margin-bottom:10px">${['Pédiatre', 'Médecin généraliste', 'PMI', 'Sage-femme', 'Hôpital'].map(v => `<button type="button" class="chip" data-who="${v}">${v}</button>`).join('')}</div>`;
    b += field('Avec qui / où', `<input name="text" maxlength="80" value="${esc(ev.text || '')}" autocomplete="off">`);
    b += field('Notes (motif, questions, compte rendu)', `<textarea name="notes" maxlength="1000" placeholder="ex. Vaccins 2 mois, questions sur les reflux…">${esc(ev.notes || '')}</textarea>`);
    b += `<p class="hint">Tu peux aussi noter un rendez-vous à venir : il s'affichera sur l'accueil.</p>`;
  } else if (t === 'growth') {
    b += field('Date', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
    b += field('Poids (kg)', `<input type="number" name="kg" inputmode="decimal" min="0.5" max="40" step="0.001" value="${ev.kg || ''}" placeholder="ex. 3,52">`);
    b += `<div class="row"><label class="field" style="flex:1"><span>Taille (cm)</span><input type="number" name="height" inputmode="decimal" min="20" max="130" step="0.1" value="${ev.height || ''}"></label>`;
    b += `<label class="field" style="flex:1"><span>Périmètre crânien (cm)</span><input type="number" name="head" inputmode="decimal" min="20" max="60" step="0.1" value="${ev.head || ''}"></label></div>`;
    b += `<p class="hint">Remplis seulement ce que tu as mesuré.</p>`;
  } else {
    b += field('Heure', `<input type="datetime-local" name="start" value="${toInput(ev.start)}" required>`);
    b += field('Note', `<textarea name="text" maxlength="500" placeholder="ex. 3 gouttes de vitamine D, rot difficile…">${esc(ev.text || '')}</textarea>`);
  }
  const ttl = { sleep: 'Dodo', feed: 'Tétée', bottle: 'Biberon', diaper: 'Couche', note: 'Note', bath: 'Bain', med: 'Traitement', growth: 'Mesure', temp: 'Température', visit: 'Rendez-vous' }[t];
  openSheet(`<h2>${isNew ? 'Ajouter : ' + ttl.toLowerCase() : ttl}</h2><form id="evf" novalidate>${b}<p class="err" id="everr" role="alert"></p>
    <div class="row"><button type="submit" class="btn primary">Enregistrer</button>${isNew ? '' : '<button type="button" class="btn danger" id="evdel">Supprimer</button>'}</div></form>`, el => {
    const form = el.querySelector('#evf');
    el.querySelectorAll('[data-ml]').forEach(btn => btn.addEventListener('click', () => { form.ml.value = btn.dataset.ml; }));
    el.querySelectorAll('[data-min]').forEach(btn => btn.addEventListener('click', () => { form.min.value = btn.dataset.min; }));
    el.querySelectorAll('[data-who]').forEach(btn => btn.addEventListener('click', () => { form.text.value = btn.dataset.who; }));
    el.querySelectorAll('[data-med]').forEach(btn => btn.addEventListener('click', () => { form.text.value = btn.dataset.med; }));
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(form), out = Object.assign({}, ev), err = el.querySelector('#everr');
      out.start = fromInput(fd.get('start'));
      if (!out.start) { err.textContent = 'Indique une heure de début.'; return; }
      if (t === 'sleep' || t === 'feed') {
        out.end = fromInput(fd.get('end'));
        if (out.end != null && out.end < out.start) { err.textContent = 'La fin doit être après le début.'; return; }
        if (out.end != null && out.end - out.start > 16 * HR) { err.textContent = 'Durée trop longue : vérifie les dates.'; return; }
        if (t === 'feed') out.side = fd.get('side');
        if (t === 'sleep' && fd.get('night') != null) out.night = fd.get('night') === '1';
      }
      if (t === 'bottle') { out.ml = Number(fd.get('ml')); if (!out.ml) { err.textContent = 'Indique la quantité.'; return; } out.milk = fd.get('milk'); }
      if (t === 'diaper') out.kind = fd.get('kind');
      if (t === 'note') { out.text = String(fd.get('text') || '').trim(); if (!out.text) { err.textContent = 'Écris quelque chose.'; return; } }
      if (t === 'med') { out.text = String(fd.get('text') || '').trim(); if (!out.text) { err.textContent = 'Indique le traitement.'; return; } }
      if (t === 'temp') { const v = parseFloat(String(fd.get('c') || '').replace(',', '.')); if (!(v >= 34 && v <= 43)) { err.textContent = 'Indique une température entre 34 et 43 °C.'; return; } out.c = Math.round(v * 10) / 10; }
      if (t === 'visit') { out.text = String(fd.get('text') || '').trim(); out.notes = String(fd.get('notes') || '').trim(); if (!out.text) { err.textContent = 'Indique avec qui ou où.'; return; } }
      if (t === 'bath') { const m = Number(fd.get('min')); out.min = m > 0 ? Math.round(m) : null; }
      if (t === 'growth') {
        const num = k => { const v = parseFloat(String(fd.get(k) || '').replace(',', '.')); return isFinite(v) && v > 0 ? v : null; };
        out.kg = num('kg'); out.height = num('height'); out.head = num('head');
        if (!out.kg && !out.height && !out.head) { err.textContent = 'Indique au moins une mesure.'; return; }
        if (out.kg && (out.kg < 0.5 || out.kg > 40)) { err.textContent = 'Poids en kilos, par exemple 3,52.'; return; }
        if (out.height && (out.height < 20 || out.height > 130)) { err.textContent = 'Taille en centimètres, par exemple 52.'; return; }
        if (out.head && (out.head < 20 || out.head > 60)) { err.textContent = 'Périmètre crânien en centimètres, par exemple 36.'; return; }
      }
      if (isNew) { out.by = S.me || null; out.at = Date.now(); }
      closeSheet(); await putEvent(out); toast('Enregistré');
    });
    const del = el.querySelector('#evdel');
    if (del) del.addEventListener('click', async () => {
      if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Confirmer la suppression'; return; }
      closeSheet(); await delEvent(ev); toast('Supprimé');
    });
  });
}
function blank(type, start) { return { id: newId(), type, start: start || Date.now(), by: S.me || null, at: Date.now() }; }

    <button class="btn primary block" type="submit">Commencer</button></form>

function importSheet() {
  openSheet(`<h2>Restaurer une sauvegarde</h2><p class="muted small" style="margin-bottom:12px">Choisis le fichier .json téléchargé depuis Petit Dodo (ou colle son contenu). Les événements déjà présents ne sont pas dupliqués.</p>
    <label class="btn primary block" style="cursor:pointer">Choisir le fichier .json<input type="file" accept=".json,application/json" id="imfile" style="display:none"></label>
    <form id="imf" style="margin-top:14px"><label class="field"><span>…ou colle le texte ici</span><textarea name="j"></textarea></label><p class="err" id="imerr" role="alert"></p><button class="btn block" type="submit">Restaurer depuis le texte</button></form>`, el => {
    const err = el.querySelector('#imerr');
    const run = async txt => {
      let data; try { data = JSON.parse(txt); } catch (x) { err.textContent = 'Ce n\u2019est pas une sauvegarde Petit Dodo valide.'; return; }
      const evs = Array.isArray(data.events) ? data.events.filter(x => x && x.id && x.type && typeof x.start === 'number') : [];
      if (!evs.length) { err.textContent = 'Aucun événement trouvé dans cette sauvegarde.'; return; }
      const have = new Set(S.events.map(e => e.id));
      const add = evs.filter(x => !have.has(x.id)).map(x => { const o = Object.assign({}, x); delete o.day; if (typeof o.by === 'string' && o.by.startsWith('u_')) o.by = S.me || null; return o; });
      closeSheet(); toast('Restauration de ' + add.length + ' événements…');
      try {
        await writeImport(add, []);
        if (data.config && (!S.config || !cfg().birth || cfg().babyName === 'Bébé')) await saveConfig(Object.assign({}, cfg(), data.config));
        toast(add.length ? add.length + ' événements restaurés' : 'Tout était déjà à jour');
      } catch (x) { toast(errMsg(x)); }
    };
    el.querySelector('#imfile').addEventListener('change', async ev => { const f = ev.target.files && ev.target.files[0]; if (f) run(await f.text()); });
    el.querySelector('#imf').addEventListener('submit', e => { e.preventDefault(); run(e.target.j.value); });
  });
}

/* ---------- Actions ---------- */
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

async function act(a, el) {
  const now = Date.now();
  switch (a) {
    case 'sleep': {
      const on = ongoing('sleep');
      if (on) { await putEvent(Object.assign({}, on, { end: now })); toast('Réveil noté · ' + dur(now - on.start) + ' de sommeil'); }
      else { await putEvent(Object.assign(blank('sleep', now), { end: null })); toast('Dodo commencé à ' + hm(now)); }
      break;
    }
    case 'feed': feedSheet(); break;
    case 'feed-start': closeSheet(); await putEvent(Object.assign(blank('feed', now), { side: el.dataset.side, end: null })); break;
    case 'feed-stop': { const f = ongoing('feed'); closeSheet(); if (f) { await putEvent(Object.assign({}, f, { end: now })); toast('Tétée : ' + dur(now - f.start)); } break; }
    case 'feed-switch': {
      const f = ongoing('feed'); closeSheet(); if (!f) break;
      await putEvent(Object.assign({}, f, { end: now }));
      await putEvent(Object.assign(blank('feed', now + 1000), { side: otherSide(f.side), end: null }));
      toast('Sein ' + sideName(otherSide(f.side))); break;
    }
    case 'feed-past': closeSheet(); editSheet(Object.assign(blank('feed', now - 30 * MIN), { end: now - 15 * MIN, side: otherSide(lastSide() || 'D') }), true); break;
    case 'bottle': { const bs = S.events.filter(e => e.type === 'bottle'); const lb = bs[bs.length - 1]; editSheet(Object.assign(blank('bottle', now), { ml: lb ? lb.ml : 90, milk: lb ? lb.milk : 'infantile' }), true); break; }
    case 'diaper': diaperSheet(); break;
    case 'diaper-save': closeSheet(); await putEvent(Object.assign(blank('diaper', now), { kind: el.dataset.kind })); toast('Couche notée'); break;
    case 'diaper-past': closeSheet(); editSheet(blank('diaper', now - 30 * MIN), true); break;
    case 'note': editSheet(blank('note', now), true); break;
    case 'add': addSheet(); break;
    case 'add-type': {
      closeSheet(); const t = el.dataset.type, ev = blank(t, now - 60 * MIN);
      if (t === 'sleep' || t === 'feed') ev.end = now - (t === 'sleep' ? 15 : 45) * MIN;
      if (t === 'feed') ev.side = otherSide(lastSide() || 'D');
      if (t === 'bottle') ev.ml = 90;
      withDefaults(ev);
      editSheet(ev, true); break;
    }
    case 'more': moreSheet(); break;
    case 'add-now': closeSheet(); editSheet(withDefaults(blank(el.dataset.type, now)), true); break;
    case 'stats-tab': S.statsTab = el.dataset.v; render(); break;
    case 'add-measure': editSheet(blank('growth', now), true); break;
    case 'report': downloadReport(); break;
    case 'edit': { const ev = S.events.find(e => e.id === el.dataset.id); if (ev) editSheet(ev, false); break; }
    case 'journal-more': S.journalDays += 14; render(); break;
    case 'snd': { const id = el.dataset.id; if (A.cur === id) stopSound(false); else { try { startSound(id); } catch (e) { toast('Lecture audio impossible sur cet appareil.'); } } render(); break; }
    case 'snd-stop': stopSound(false); render(); break;
    case 'snd-timer': A.timerMin = Number(el.dataset.v); A.stopAt = A.cur && A.timerMin ? Date.now() + A.timerMin * MIN : null; render(); break;
    case 'export': {
      const txt = JSON.stringify({ app: 'petit-dodo', v: 1, exported: new Date().toISOString(), config: S.config, events: S.events }, null, 0);
      try { await navigator.clipboard.writeText(txt); toast('Données copiées (' + S.events.length + ' événements)'); }
      catch (e) { openSheet(`<h2>Copie manuelle</h2><p class="muted small" style="margin-bottom:8px">Sélectionne tout le texte et copie-le.</p><label class="field"><span>Sauvegarde</span><textarea readonly style="min-height:200px">${esc(txt)}</textarea></label>`); }
      break;
    }
    case 'import': importSheet(); break;
    case 'export-file': {
      const txt = JSON.stringify({ app: 'petit-dodo', v: 2, exported: new Date().toISOString(), config: S.config, events: S.events.map(e => { const o = Object.assign({}, e); delete o.day; return o; }) });
      if (await saveFile('petit-dodo-sauvegarde-' + dayKey(Date.now()) + '.json', new Blob([txt], { type: 'application/json' }))) toast('Sauvegarde prête (' + S.events.length + ' événements)');
      break;
    }
    case 'apply-update': applyUpdate(); break;
    case 'logout': if (FBM && AUTH) { try { await FBM.auth.signOut(AUTH); } catch (e) {} } break;
    case 'use-local': try { localStorage.setItem('petitdodo.mode', 'local'); } catch (e) {} location.reload(); break;
    case 'use-sync': try { localStorage.removeItem('petitdodo.mode'); } catch (e) {} location.reload(); break;
    case 'reset-pw': {
      const email = ($('#loginf') && $('#loginf').email.value || '').trim();
      if (!email) { $('#loginerr').textContent = 'Écris ton e-mail, puis touche « Mot de passe oublié ».'; break; }
      try { await FBM.auth.sendPasswordResetEmail(AUTH, email); toast('E-mail de réinitialisation envoyé'); } catch (e) { $('#loginerr').textContent = 'Envoi impossible : vérifie l\u2019adresse.'; }
      break;
    }
    case 'import-napper': importNapperSheet(); break;
    case 'theme': S.theme = el.dataset.v; try { localStorage.setItem('petitdodo.theme', S.theme); } catch (e) {} S.settingsDirty = false; render(); break;
  }
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { if (S.tab !== tab.dataset.tab) { S.tab = tab.dataset.tab; S.settingsDirty = false; render(); window.scrollTo(0, 0); } return; }
  const b = e.target.closest('[data-act]');
  if (b) { e.preventDefault(); act(b.dataset.act, b); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet(); });
document.addEventListener('input', e => {
  if (e.target.id === 'vol') { A.vol = Number(e.target.value); if (A.el) try { A.el.volume = A.vol; } catch (x) {} }
  if (e.target.closest('#cfgf')) S.settingsDirty = true;
});
document.addEventListener('submit', e => {
  if (e.target.id === 'namef') { e.preventDefault(); const n = String(new FormData(e.target).get('n') || '').trim(); if (n) saveMyName(n); return; }
  if (e.target.id !== 'cfgf') return;
  e.preventDefault(); const fd = new FormData(e.target);
  S.settingsDirty = false;
  const ga = Math.round(Number(fd.get('gaWeeks')) || 0), gaOk = ga >= 22 && ga <= 43;
  const pw = gaOk && ga < 37 ? 40 - ga : 0; // âge corrigé : seulement pour les prématurés (< 37 SA), référence 40 SA
  saveConfig(Object.assign({}, cfg(), { babyName: String(fd.get('babyName') || '').trim() || 'Bébé', birth: fd.get('birth') || '', wakeTime: fd.get('wakeTime') || '07:00', bedtime: fd.get('bedtime') || '19:30', gaWeeks: gaOk ? ga : null, premWeeks: pw, sex: fd.get('sex') || cfg().sex || null }));
  toast('Réglages enregistrés');
});

/* ---------- Render ---------- */
function render() {
  if (S.tab === 'settings' && S.settingsDirty) return;
  const now = Date.now(); let h = '';
  const gate = S.mode === 'auth' || S.mode === 'setup';
  document.querySelector('.nav').style.display = gate ? 'none' : '';
  if (gate) { applyTheme(); $('#main').innerHTML = banner() + (S.mode === 'auth' ? viewAuth() : viewSetup()); return; }
  if (S.tab === 'home') h = viewHome(now);
  else if (S.tab === 'journal') h = viewJournal(now);
  else if (S.tab === 'stats') h = viewStats(now);
  else if (S.tab === 'sounds') h = viewSounds();
  else h = viewSettings();
  applyTheme();
  $('#main').innerHTML = banner() + h;
  document.querySelectorAll('.nav [data-tab]').forEach(b => { if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (S.configLoaded && !S.config && !S.onboardShown && !$('#sheet').classList.contains('open')) { S.onboardShown = true; onboardSheet(); }
}
let ticks = 0;
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach(el => { el.textContent = durClock(now - Number(el.dataset.since)); });
  document.querySelectorAll('[data-until-clock]').forEach(el => { el.textContent = durClock(Number(el.dataset.untilClock) - now); });
  if (A.stopAt && now >= A.stopAt) { stopSound(true); if (S.tab === 'sounds') render(); }
  if (++ticks % 30 === 0 && (S.tab === 'home' || S.tab === 'journal' || S.tab === 'stats')) render();
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab !== 'settings') render(); });
init();
</script>
</body>
</html>
